[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace.dependencies]
ccc-bench = { path = "crates/ccc-bench" }
ccc-enrich = { path = "crates/ccc-enrich" }
ccc-eval = { path = "crates/ccc-eval" }
ccc-index = { path = "crates/ccc-index" }
ccc-learn = { path = "crates/ccc-learn" }
ccc-ledger = { path = "crates/ccc-ledger" }
ccc-ner = { path = "crates/ccc-ner" }
ccc-pipeline = { path = "crates/ccc-pipeline" }
ccc-proxy = { path = "crates/ccc-proxy" }
ccc-prune = { path = "crates/ccc-prune" }
ccc-redact = { path = "crates/ccc-redact" }
ccc-route = { path = "crates/ccc-route" }
ccc-slm = { path = "crates/ccc-slm" }
ccc-verify = { path = "crates/ccc-verify" }
ccc-wire = { path = "crates/ccc-wire" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
